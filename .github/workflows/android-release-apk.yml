name: Build & Sign Android Release APK & AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    name: Build, Sign & Publish Last Relic APK
    runs-on: ubuntu-latest

    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment & Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Optional: Restore custom google-services.json ONLY if it matches our applicationId and includes OAuth client_type 3
          if [ -n "$GOOGLE_SERVICES_JSON" ] && echo "$GOOGLE_SERVICES_JSON" | grep -q "com.aistudio.lastrelic.xkvpzr" && echo "$GOOGLE_SERVICES_JSON" | grep -q '"client_type": *3'; then
            echo "Applying validated GOOGLE_SERVICES_JSON secret..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Using repository app/google-services.json (verified for com.aistudio.lastrelic.xkvpzr)..."
          fi

          # Decode debug.keystore from debug.keystore.base64 if needed
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Prepare Release Keystore (app/build.gradle.kts requires alias 'upload')
          KEYSTORE_FILE="${GITHUB_WORKSPACE:-$(pwd)}/my-upload-key.jks"
          KEYSTORE_VALID=false

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64 secret..."
            rm -f "$KEYSTORE_FILE"
            if echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_FILE" 2>/dev/null; then
              EFF_KEY_PASS="${KEY_PASSWORD:-$STORE_PASSWORD}"
              if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
                if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
                  SRC_ALIAS="${KEY_ALIAS:-}"
                  if [ -z "$SRC_ALIAS" ]; then
                    SRC_ALIAS=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name:/{print $2; exit}')
                  fi
                  if [ -n "$SRC_ALIAS" ]; then
                    echo "Normalizing keystore alias '$SRC_ALIAS' to 'upload'..."
                    keytool -changealias -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias "$SRC_ALIAS" -destalias upload -keypass "$EFF_KEY_PASS" >/dev/null 2>&1 || true
                  fi
                fi
                if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
                  KEYSTORE_VALID=true
                  echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
                  echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
                  echo "KEY_PASSWORD=$EFF_KEY_PASS" >> $GITHUB_ENV
                fi
              fi
            fi
          fi

          if [ "$KEYSTORE_VALID" != "true" ]; then
            echo "Generating self-contained release keystore (alias: upload)..."
            rm -f "$KEYSTORE_FILE"
            FALLBACK_PASS="${STORE_PASSWORD:-androidrelease}"
            EFF_KEY_PASS="${KEY_PASSWORD:-$FALLBACK_PASS}"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -dname "CN=Last Relic, OU=GameDev, O=GoogleDeveloper, L=Berlin, S=Berlin, C=DE" \
              -storepass "$FALLBACK_PASS" \
              -keypass "$EFF_KEY_PASS"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$EFF_KEY_PASS" >> $GITHUB_ENV
          fi

          # Pre-cache Robolectric SDK 36 runtime JAR from Google's Maven Central mirror for fast offline unit testing
          ROBO_M2_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          ROBO_JAR="$ROBO_M2_DIR/android-all-instrumented-16-robolectric-13921718-i7.jar"
          if [ ! -f "$ROBO_JAR" ]; then
            mkdir -p "$ROBO_M2_DIR"
            curl -sSL --retry 3 "https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/android-all-instrumented-16-robolectric-13921718-i7.jar" -o "$ROBO_JAR" || rm -f "$ROBO_JAR"
          fi

      - name: Run Unit & Runtime Integrity Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Signed Release APK & App Bundle (AAB)
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Verify APK Signature & Alignment
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Built Signed APK: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "Error: Signed Release APK was not found!"
            exit 1
          fi
          cp "$APK_FILE" "LastRelic-release-signed.apk"

          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" "LastRelic-release-signed.aab"
          fi

          # Verify APK signature using apksigner from Android SDK
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -d "$SDK_DIR/build-tools" ]; then
            APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose "LastRelic-release-signed.apk"
            fi
          fi

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastRelic-Signed-Release-APK
          path: |
            LastRelic-release-signed.apk
            LastRelic-release-signed.aab
          retention-days: 90

      - name: Publish to Google Play Console (Internal Track)
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aistudio.lastrelic.xkvpzr
          releaseFiles: LastRelic-release-signed.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2

      - name: Determine Release Tag & Version Information
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          VERSION_NAME="${VERSION_NAME:-6.0}"
          VERSION_CODE="${VERSION_CODE:-6}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="Last Relic ${TAG_NAME}"
          else
            TAG_NAME="v${VERSION_NAME}-b${VERSION_CODE}-${SHORT_SHA}"
            RELEASE_TITLE="Last Relic v${VERSION_NAME} (Build ${VERSION_CODE} · ${SHORT_SHA})"
          fi

          echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "Release target: Tag=${TAG_NAME}, Title=${RELEASE_TITLE}"

      - name: Publish GitHub Release with APK & AAB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ### 🎮 Last Relic – Release Build
            - **Version:** v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
            - **Commit:** `${{ github.sha }}`
            - **Branch/Ref:** `${{ github.ref_name }}`

            #### 📲 Direkt-Download:
            - 🔹 **[LastRelic-release-signed.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/LastRelic-release-signed.apk)** (Installierbare Android-APK)
            - 🔹 **[LastRelic-release-signed.aab](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/LastRelic-release-signed.aab)** (Google Play Bundle)
          files: |
            LastRelic-release-signed.apk
            LastRelic-release-signed.aab
          generate_release_notes: true
          make_latest: true
