<script>
/* ================= POLISHED MULTI-HARMONIC AUDIO MANAGER ================= */
class AudioManager {
  constructor(){
    this.ctx=null;this.enabled=false;this.sfxOn=true;this.musicOn=true;
    this.musicGain=null;this.musicSource=null;this.sounds={};this.arpTimer=null;
  }
  init(){
    if(!this.ctx){
      try{
        this.ctx=new (window.AudioContext||window.webkitAudioContext)();
        this.enabled=true;
      }catch(e){}
    }
    if(this.ctx&&this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}
    return this.enabled;
  }
  play(name,vol=1){
    if(!this.enabled||!this.sfxOn)return;
    const s=this.sounds[name];
    if(s&&s.buffer){
      const src=this.ctx.createBufferSource();src.buffer=s.buffer;
      const g=this.ctx.createGain();g.gain.setValueAtTime(vol,this.ctx.currentTime);
      src.connect(g);g.connect(this.ctx.destination);src.start(0);
    } else this.synth(name);
  }
  tone(type,f1,f2,dur,gainVal,delay=0){
    if(!this.ctx)return;
    const t=this.ctx.currentTime+delay;
    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    const flt=this.ctx.createBiquadFilter();
    flt.type='lowpass';flt.frequency.setValueAtTime(2800,t);
    o.type=type;
    o.frequency.setValueAtTime(f1,t);
    if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(gainVal,t);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(flt);flt.connect(g);g.connect(this.ctx.destination);
    o.start(t);o.stop(t+dur+0.02);
  }
  synth(name){
    if(!this.ctx)return;
    if(name==='shoot'){
      this.tone('triangle',920,260,0.065,0.09,0);
      this.tone('sine',1400,480,0.045,0.05,0);
    }else if(name==='hit'){
      this.tone('sawtooth',190,55,0.14,0.15,0);
      this.tone('square',110,45,0.12,0.08,0);
    }else if(name==='enemyhit'){
      this.tone('triangle',520,210,0.06,0.075,0);
    }else if(name==='levelup'){
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone('triangle',f,f*1.02,0.22,0.11,i*0.065));
    }else if(name==='chest'){

      this.tone('sine',440,440,0.1,0.05,0);
    }
  }
  startMusic(){
    if(!this.enabled||!this.musicOn||this.musicSource)return;
    const t=this.ctx.currentTime;
    this.musicGain=this.ctx.createGain();
    this.musicGain.gain.setValueAtTime(this.musicOn?0.02:0,t);
    const flt=this.ctx.createBiquadFilter();
    flt.type='lowpass';flt.frequency.setValueAtTime(420,t);
    const o1=this.ctx.createOscillator(),o2=this.ctx.createOscillator();
    const g1=this.ctx.createGain(),g2=this.ctx.createGain();
    o1.type='sawtooth';o2.type='triangle';
    o1.frequency.setValueAtTime(110,t);o2.frequency.setValueAtTime(164.81,t);
    g1.gain.setValueAtTime(0.45,t);g2.gain.setValueAtTime(0.35,t);
    o1.connect(g1);o2.connect(g2);g1.connect(flt);g2.connect(flt);
    flt.connect(this.musicGain);this.musicGain.connect(this.ctx.destination);
    o1.start();o2.start();
    const notes=[220,261.63,329.63,293.66,246.94,329.63,392,329.63];
    let step=0;
    this.arpTimer=setInterval(()=>{
      if(!this.enabled||!this.musicOn||isPaused||mode!=='play')return;
      const f=notes[step%notes.length];step++;
      this.tone('sine',f,f,0.45,0.016,0);
    },650);
    this.musicSource={o1,o2,g1,g2};
  }
  stopMusic(){
    if(this.arpTimer){clearInterval(this.arpTimer);this.arpTimer=null;}
    if(this.musicSource){try{this.musicSource.o1.stop();this.musicSource.o2.stop();}catch(e){}this.musicSource=null;}
    if(this.musicGain){try{this.musicGain.gain.setValueAtTime(0,this.ctx.currentTime);}catch(e){}this.musicGain=null;}
  }
  toggleMusic(){
    this.musicOn=!this.musicOn;
    if(this.musicOn)this.startMusic();else this.stopMusic();
  }
  toggleSfx(){this.sfxOn=!this.sfxOn;}

  if(lb.length>30)lb.length=30;
  try{localStorage.setItem('lr_lb',JSON.stringify(lb));}catch(e){}

    try{window.AndroidBridge.submitScore(pName, S?.playerClass||'warrior', score, level, floor, kills, items);}catch(e){}

function spawnMinion(x,y){

  minions.push(m);sndSummon();emit(x,y,.6,'#3dffc0',18,3,.5,2);

function updateMinions(dt){
  for(let i=minions.length-1;i>=0;i--){
    const m=minions[i];m.life-=dt;m.cd-=dt;
    let target=m.target;
    if(!target||target.dead){
      let best=null,bd=99;
      for(const e of en){if(e.dead)continue;const d=Math.hypot(e.x-m.x,e.y-m.y);if(d<bd){bd=d;best=e;}}
      target=best;m.target=target;
    }
    if(target){
      const dx=target.x-m.x,dy=target.y-m.y,d=Math.hypot(dx,dy)||1;
      if(d<.75){if(m.cd<=0){hitE(target,m.dmg,false);m.cd=.75;}}
      const sp=3.2;mv(m,dx/d*sp*dt,dy/d*sp*dt);
      m.mesh.position.set(m.x,.5,m.y);
      m.mesh.rotation.y+=dt*2.4;
    }else{
      m.mesh.position.set(m.x,.5,m.y);
    }
    if(m.life<=0){world.remove(m.mesh);minions.splice(i,1);}
  }
}

function renderVillageTab(tab){

 for(const f of flick){f.m.scale.y=.4*(.85+Math.sin(tm*12+f.ph)*.2+Math.sin(tm*7.3+f.ph)*.1);f.g.scale.set(5+Math.sin(tm*9+f.ph)*.4,1,5+Math.sin(tm*9+f.ph)*.4)}
 if(novaT>0){novaT-=dt;const k=1-novaT/.42;novaM.scale.set(1+k*6.5,1,1+k*6.5);novaMat.opacity=.85*(1-k);if(novaT<=0)novaM.visible=false}

 expT-=dt;if(expT<=0){expT=.25;explore()}
